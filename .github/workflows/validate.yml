name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin.json
        run: |
          python -c "import json; d=json.load(open('.claude-plugin/plugin.json')); assert all(d.get(k) for k in ('name','version','skills')), 'plugin.json missing a required field'; print('plugin.json OK:', d['name'], d['version'])"

      - name: Check skill structure
        run: |
          test -f skills/blog-smart-images/SKILL.md || { echo "SKILL.md missing"; exit 1; }
          head -1 skills/blog-smart-images/SKILL.md | grep -q '^---$' || { echo "SKILL.md missing YAML frontmatter"; exit 1; }
          echo "skill structure OK"

      - name: Syntax-check Python scripts
        run: |
          python -m py_compile skills/blog-smart-images/scripts/*.py
          echo "Python scripts compile OK"

      - name: Run tests
        run: |
          python -m unittest discover tests -v
